{% extends 'layout.html' %}
{% load static %}

{% block title %}
Job Lizard - New Job App
{% endblock %}

{% block content %}
<style>
    .job-detail-wrapper {
        display: flex;
        align-items: flex-start;
        min-width: 700px;
        overflow-x: auto;
    }
    .job-detail-logo {
        width: 200px;
        flex-shrink: 0;
        margin: 0 20px;
    }
    .job-detail-content {
        flex: 1;
        min-width: 0;
    }
    #company-duplicate-warning {
        margin-top: -0.5rem;
        margin-bottom: 1rem;
        min-height: 1.25rem;
        visibility: hidden;
    }
    #company-duplicate-warning.has-suggestions {
        visibility: visible;
    }
</style>

<div class="job-detail-wrapper">
    <img src="{% static 'media/hr_lizard.png' %}" alt="HR Lizard" class="job-detail-logo">

    <div class="container-fluid text-bg-light p-3 rounded-5 job-detail-content">
        <div class="row align-items-start">
            <div class="col mb-3 text-secondary">
                <h2 class="fs-3 text-secondary ms-2"><b>New Job Application</b></h2>
            </div>
        </div>
        <div class="form-group">
            <div class="row align-items-start mb-2">
                <div class="col-8 m-3 text-top">

                    <form action="{% url 'new-job' %}" method="post" enctype="multipart/form-data">
                        {% csrf_token %}
                        {{ form.as_p }}
                        <button class="btn btn-success mt-3">Add Job</button>
                    </form>
                </div>
            </div>
        </div>
    </div>
</div>

<script>
    (function () {
        const companyInput = document.getElementById("id_company");
        if (!companyInput) return;

        // Turn off the browser's own autofill dropdown for this field so it
        // doesn't get confused with (or cover up) our suggestion box below.
        companyInput.setAttribute("autocomplete", "off");

        // Build the suggestion box and drop it in right after the field's
        // wrapping <p> (from form.as_p), so no template restructuring is needed.
        // It always occupies its reserved height (see CSS), so Title never
        // shifts up/down depending on whether a suggestion is showing.
        const warningBox = document.createElement("div");
        warningBox.id = "company-duplicate-warning";
        warningBox.innerHTML = '<small class="text-primary">' +
            '<span id="company-duplicate-list"></span></small>';

        const wrappingParagraph = companyInput.closest("p") || companyInput.parentElement;
        wrappingParagraph.insertAdjacentElement("afterend", warningBox);

        const warningList = document.getElementById("company-duplicate-list");

        let debounceTimer = null;

        function clearSuggestions() {
            warningBox.classList.remove("has-suggestions");
            warningList.textContent = "";
        }

        function fetchSuggestions(query) {
            fetch("{% url 'company-suggestions' %}?q=" + encodeURIComponent(query), {
                method: "GET",
                headers: { "X-Requested-With": "XMLHttpRequest" },
            })
                .then((response) => response.json())
                .then((data) => {
                    if (data.companies && data.companies.length > 0) {
                        warningList.textContent = data.companies.join(", ");
                        warningBox.classList.add("has-suggestions");
                    } else {
                        clearSuggestions();
                    }
                })
                .catch(() => clearSuggestions());
        }

        companyInput.addEventListener("input", function () {
            const value = companyInput.value.trim();

            clearTimeout(debounceTimer);
            clearSuggestions();

            if (value.length < 3) {
                return;
            }

            debounceTimer = setTimeout(function () {
                fetchSuggestions(value);
            }, 1000);
        });
    })();
</script>
{% endblock %}
