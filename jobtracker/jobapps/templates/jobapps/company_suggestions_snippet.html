<div id="company-duplicate-warning" class="mt-1" style="display: none;">
    <small class="text-warning">
        You've already applied to:
        <span id="company-duplicate-list"></span>
    </small>
</div>

<script>
    (function () {
        const companyInput = document.getElementById("id_company");
        const warningBox = document.getElementById("company-duplicate-warning");
        const warningList = document.getElementById("company-duplicate-list");

        if (!companyInput) return;

        let debounceTimer = null;

        function getCookie(name) {
            const match = document.cookie.match('(^|;)\\s*' + name + '\\s*=\\s*([^;]+)');
            return match ? match.pop() : '';
        }

        function clearSuggestions() {
            warningBox.style.display = "none";
            warningList.textContent = "";
        }

        function fetchSuggestions(query) {
            fetch("{% url 'company-suggestions' %}?q=" + encodeURIComponent(query), {
                method: "GET",
                headers: { "X-Requested-With": "XMLHttpRequest" },
            })
                .then((response) => response.json())
                .then((data) => {
                    if (data.companies && data.companies.length > 0) {
                        warningList.textContent = data.companies.join(", ");
                        warningBox.style.display = "block";
                    } else {
                        clearSuggestions();
                    }
                })
                .catch(() => clearSuggestions());
        }

        companyInput.addEventListener("input", function () {
            const value = companyInput.value.trim();

            clearTimeout(debounceTimer);
            clearSuggestions();

            if (value.length < 3) {
                return;
            }

            debounceTimer = setTimeout(function () {
                fetchSuggestions(value);
            }, 2000);
        });
    })();
</script>
