{% extends 'layout.html' %}

{% block title %}
Job Lizard - User Profile
{% endblock %}

{% block content %}
<div class="container text-bg-success p-3 rounded-5">
    <h1>Profile for {{ request.user.username }}</h1>
    <form action="{% url 'users:profile' %}" method="post">
        {% csrf_token %}
        {{ form.as_p }}
        <div class="container mt-2">
            <button class="btn btn-light">Save</button>
        </div>
    </form>
</div>
{% endblock %}
