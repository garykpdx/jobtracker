{% extends 'layout.html' %}
{% load static %}

{% block title %}
Job Lizard - Login
{% endblock %}

{% block content %}
<style>
    .job-detail-wrapper {
        display: flex;
        align-items: flex-start;
        min-width: 700px;
        overflow-x: auto;
    }

    .job-detail-logo {
        width: 200px;
        flex-shrink: 0;
        margin: 0 20px;
    }

    .job-detail-content {
        flex: 1;
        min-width: 0;
    }
</style>

<div class="job-detail-wrapper">
    <img src="{% static 'media/hr_lizard.png' %}" alt="HR Lizard" class="job-detail-logo">
<div class="container-sm text-bg-light p-3 rounded-5">
    <div class="container text-center">
        <div class="row align-items-start">
            <div class="col mb-4">
                <h1>User Login</h1>
            </div>
        </div>
        <div class="row align-items-start mb-2">
            <div class="col">
            </div>
        </div>
        <div class="row align-items-start mb-2">
            <div class="col">
                <form action="{% url 'users:login' %}" method="post">
                    {% csrf_token %}
                    {{ form.as_p }}
                    {% if request.GET.next %}
                        <input type="hidden" name="next" value="{{ request.GET.next }}" />
                    {% endif %}
                    <div class="container mt-4">
                        <button class="btn btn-success mt-3">Submit</button>
                    </div>
                </form>
            </div>
        </div>
    </div>
</div>
{% endblock %}
